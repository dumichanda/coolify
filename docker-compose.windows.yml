version: "3.8"

services:
  coolify-testing-host:
    init: true
    image: ghcr.io/coollabsio/coolify-testing-host:latest
    pull_policy: always
    container_name: coolify-testing-host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/data/coolify

  coolify:
    image: ghcr.io/coollabsio/coolify:latest
    pull_policy: always
    container_name: coolify
    restart: always
    working_dir: /var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: .env
        target: /var/www/html/.env
        read_only: true
      - ./ssh:/var/www/html/storage/app/ssh
      - ./applications:/var/www/html/storage/app/applications
      - ./databases:/var/www/html/storage/app/databases
      - ./services:/var/www/html/storage/app/services
      - ./backups:/var/www/html/storage/app/backups
      - ./webhooks-during-maintenance:/var/www/html/storage/app/webhooks-during-maintenance
    env_file:
      - .env
    environment:
      - APP_ENV
      - APP_NAME
      - APP_ID
      - APP_KEY
      - APP_URL
      - APP_PORT
      - APP_DEBUG
      - DB_HOST
      - DB_PORT
      - DB_DATABASE
      - DB_USERNAME
      - DB_PASSWORD
      - REDIS_PASSWORD
      - PUSHER_APP_ID
      - PUSHER_APP_KEY
      - PUSHER_APP_SECRET
      - PUSHER_CLUSTER
      - ADMIN_EMAIL
      - ADMIN_USERNAME
      - ADMIN_PASSWORD
      - RAY_ENABLED
      - RAY_PORT
      - TELESCOPE_ENABLED
      - SSH_MUX_ENABLED
      - IS_WINDOWS_DOCKER_DESKTOP=true
    ports:
      - "${APP_PORT:-8000}:8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000/api/health || exit 1"]
      interval: 5s
      retries: 10
      timeout: 2s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    pull_policy: always
    container_name: coolify-db
    restart: always
    env_file:
      - .env
    volumes:
      - coolify-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
        ]
      interval: 5s
      retries: 10
      timeout: 2s

  redis:
    image: redis:7-alpine
    pull_policy: always
    container_name: coolify-redis
    restart: always
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - coolify-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 10
      timeout: 2s

  soketi:
    image: ghcr.io/coollabsio/coolify-realtime:1.0.6
    pull_policy: always
    container_name: coolify-realtime
    restart: always
    env_file:
      - .env
    ports:
      - "6001:6001"
      - "6002:6002"
    volumes:
      - ./ssh:/var/www/html/storage/app/ssh
    environment:
      APP_NAME: ${APP_NAME}
      SOKETI_DEBUG: false
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6001/ready && wget -qO- http://127.0.0.1:6002/ready || exit 1"]
      interval: 5s
      retries: 10
      timeout: 2s

volumes:
  coolify-db:
    name: coolify-db
  coolify-redis:
    name: coolify-redis
